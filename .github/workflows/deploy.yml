name: Deploy Emby Keepalive Bot
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply emby-keepalive --remote --config wrangler.jsonc
      - name: Set Worker secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.jsonc
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET --config wrangler.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Configure Telegram webhook
        if: vars.WORKER_URL != ''
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          WORKER_URL_CLEAN="${WORKER_URL%/}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'content-type: application/json' \
            -d "{\"url\":\"${WORKER_URL_CLEAN}/telegram/webhook\",\"secret_token\":\"${WEBHOOK_SECRET}\"}"
